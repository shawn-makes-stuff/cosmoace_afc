# ─────────────────────────────────────────────────────────────────────────────
# AFC + ACE Pro — hybrid path (frame 4-in-1, no toolhead hub)
#
# Four equal ACE→hub tubes merge at a Bambu (or similar) 4-in-1 near the frame.
# A passthrough switch on the stock frame runout pin sits right after that
# merge. ONE bowden runs to a toolhead pre-gear sensor (no 4-port on the head).
# Idle tip: parked hub_clear_mm behind the collector until TOOL_LOAD.
#
# Insert: wait NFC seek -> wait hub clear if occupied -> feed-assist to hub -> park.
# Loads: home hub (assist) -> home toolhead over afc_bowden_length -> sync.
# Unloads: retract until hub clears, park hub_clear_mm behind it.
#
# The frame pin is AFC's real hub switch (not virtual + hub_sensor_name). Stock
# filament_sensor is removed; toolhead sensor is the runout/PAUSE path.
# Machine pin is set in cc1-hybrid.cfg / cc2-hybrid.cfg.
#
# Measure bowden with AFC_ACE_CALIBRATE_PATH (or _HUB PARK=0 / _BOWDEN).
# EXPERIMENTAL. See README.md.
# ─────────────────────────────────────────────────────────────────────────────

# Frame sensor pin is claimed by [AFC_hub] — drop the stock section.
[!filament_switch_sensor filament_sensor]

# PAUSE/RESUME / filament present: toolhead pre-gear sensor.
[gcode_macro _global_var]
variable_runout_sensor_name: 'filament_switch_sensor extruder_tool_start'

# ── Unit ─────────────────────────────────────────────────────────────────────
[AFC_ACE]
hub_clear_mm: 80
sensor_approach_mm: 30
sensor_approach_speed: 15
sync_load_mm: 8
# Slot -> hub (through the 4-in-1). Cap only; sensor stops the feed.
dist_hub: 1200

# ── Hub ──────────────────────────────────────────────────────────────────────
# Real switch_pin comes from cc*-hybrid.cfg (overrides afc-ace.cfg virtual).
# Hub switch -> toolhead sensor (the single bowden). MEASURE THIS.
[AFC_hub ACE_1]
afc_bowden_length: 800
afc_unload_bowden_length: 800
enable_hub_runout: False

# ── Toolhead ─────────────────────────────────────────────────────────────────
[AFC_extruder extruder]
tool_stn: 51.5
enable_tool_runout: False
