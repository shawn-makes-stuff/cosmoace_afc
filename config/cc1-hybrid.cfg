# AFC + ACE Pro: Centauri Carbon 1, hybrid path (frame 4-in-1, no toolhead hub).
# Add to printer.cfg, below [include klipper-readonly/*.cfg]:
#   [include ../plugins/AFC_ACE/config/cc1-hybrid.cfg]
#
# Does NOT include cc1-head.cfg (that story is 4-tube toolhead). Pulls
# canvas-toolhead board bits only. Frame PC0 is AFC's hub switch.

[include /etc/klipper/config/extras-readonly/afc.cfg]
[include afc-ace.cfg]
[include afc-ace-macros.cfg]
[include afc-ace-hybrid.cfg]

# CANVAS toolhead board / thermistor / cover / CLEAN_NOZZLE / KICK end — not
# a 4-port toolhead filament hub.
[include /etc/klipper/config/extras-readonly/canvas-toolhead.cfg]

[AFC_hub ACE_1]
switch_pin: PC0

[AFC_extruder extruder]
pin_tool_start: !hotend:PB2
