# ─────────────────────────────────────────────────────────────────────────────
# AFC + ACE Pro on COSMOS — macros shared by the Centauri Carbon 1 and 2
#
# The pieces AFC calls out to. MOVE_TO_TRAY, KICK, CLEAN_NOZZLE and
# _global_var are COSMOS's own, per machine; the cutter position (X255) is the
# same on both.
# ─────────────────────────────────────────────────────────────────────────────

# Double-press cut. A missed cut is expensive: the ACE retract then drags
# uncut filament back down the bowden, so it presses twice.
[gcode_macro CUT_FILAMENT]
variable_retract_length: 10
variable_pushback_length: 5
gcode:
  {% set self = printer["gcode_macro CUT_FILAMENT"] %}
  {% set retract_length = self.retract_length|float %}
  {% set pushback_length = self.pushback_length|float %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  M83
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    G1 E-{retract_length} F300
  {% endif %}
  G0 Y20 F12000
  G0 X255 F12000
  {% for _ in range(2) %}
    G0 Y4 F18000
    G0 Y20 F18000
  {% endfor %}
  {% if printer.extruder.target >= 180 and printer.extruder.can_extrude %}
    MOVE_TO_TRAY
    G1 E{pushback_length} F300
    G1 E-{pushback_length} F600
  {% endif %}
  M400

# COSMOS's PURGE (shared-macros.cfg), unchanged except that it moves to the
# tray before heating a cold nozzle, so nothing oozes onto the bed on the way.
[gcode_macro PURGE]
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set always_kick = global.always_kick_during_purge|lower == 'true' %}
    {% set split_length = global.purge_split_length|float %}
    {% set default_purge_amount = global.purge_default_amount|float %}
    {% set purge_length = params.PURGE_LENGTH|default(default_purge_amount, true)|float %}

    {% if printer.extruder.target < 180 or not printer.extruder.can_extrude %}
        MOVE_TO_TRAY
        M104 S{global.extruder_temp.purging} ; Heat nozzle to purging temp
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={global.extruder_temp.purging} MAXIMUM={global.extruder_temp.purging+5}
    {% endif %}

    {% set rounds = [((purge_length / split_length)|round(0, 'ceil'))|int , 1] |max %}
    {% set per_round = (purge_length / rounds) | round(0, 'ceil') %} # small ass purge

    RESPOND MSG="Purging {purge_length}mm of filament in {rounds} rounds of {per_round}mm each"

    ; Turn off fans
    _SAVE_FAN_STATE NAME=purge
    M107 P1
    {% if 'fan_generic aux_fan' in printer %}
        M107 P2
    {% endif %}

    {% for i in range(rounds) %}
        MOVE_TO_TRAY
        M83
        RESPOND TYPE=command MSG="Purging {per_round}mm of filament ({i + 1}/{rounds})"
        G1 Y265 F1200
        G1 E{per_round} F300
        G1 Y264 F1200

        {% if (not always_kick) and i + 1 == rounds %} # last round, clean nozzle
            CLEAN_NOZZLE RETRACT=true
        {% else %}
            KICK
        {% endif %}
    {% endfor %}

    ; Restore fans
    _RESTORE_FAN_STATE NAME=purge

# Slicer colour change. With T, change to that tool (L sets the purge,
# otherwise AFC's default applies). Without T it is a plain manual filament
# change, so pause — falling back to T0 would load the wrong colour.
[gcode_macro M600]
gcode:
    {% if 'T' in params %}
        T{params.T|int}{% if 'L' in params %} PURGE_LENGTH={params.L|float}{% endif %}
    {% else %}
        PAUSE
    {% endif %}

# One-click buttons in Mainsail's macro panel for the optional ACE Pro
# dashboard panel. Mainsail's own AFC panel stays either way.
[gcode_macro AFC_ACE_PANEL_INSTALL]
description: Install the optional ACE Pro Mainsail panel
gcode:
    AFC_ACE_PANEL ACTION=INSTALL

[gcode_macro AFC_ACE_PANEL_REMOVE]
description: Remove the ACE Pro Mainsail panel
gcode:
    AFC_ACE_PANEL ACTION=REMOVE

# Feed a spool straight into the printer, bypassing the ACE and AFC: unloads
# the loaded lane, turns on AFC's virtual bypass, and gives the path sensor
# its runout pause back. Mainsail's virtual_bypass switch does the same,
# without the unload.
[gcode_macro AFC_ACE_BYPASS_ON]
description: Bypass the ACE: feed a spool directly
gcode:
    AFC_ACE_BYPASS ENABLE=1

[gcode_macro AFC_ACE_BYPASS_OFF]
description: Back to the ACE lanes (unload the bypass spool first)
gcode:
    AFC_ACE_BYPASS ENABLE=0
