# AFC + ACE Pro: Centauri Carbon 2, hybrid path (frame 4-in-1, no toolhead hub).
# Add to printer.cfg, below [include klipper-readonly/*.cfg]:
#   [include ../plugins/AFC_ACE/config/cc2-hybrid.cfg]
#
# Frame filament_sensor board pin is AFC's hub switch. Stock toolhead sensor
# stays as pin_tool_start. Drops CC2 canvas filament / motion extras.

[include /etc/klipper/config/extras-readonly/afc.cfg]
[include afc-ace.cfg]
[include afc-ace-macros.cfg]
[include afc-ace-hybrid.cfg]

[!canvas_filament_sensor]
[!filament_motion_sensor filament_motion]

[AFC_hub ACE_1]
switch_pin: filament_sensor:filament

[AFC_extruder extruder]
pin_tool_start: !hotend:PB1
