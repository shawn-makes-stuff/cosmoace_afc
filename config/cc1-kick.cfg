# Centauri Carbon 1 only: COSMOS's CC1 KICK waits 2 s under the fan, which
# leaves the ACE purge blob soft enough to smear instead of snapping off.
# The wipe matches the CANVAS head's CLEAN_NOZZLE strokes.

# Ends with the part fan back at whatever it was when KICK started.
# cool_ms is the full-fan blast before the wipe: the blob has to be cold
# enough to snap off, not smear (COSMOS stock waits 2000).
[gcode_macro KICK]
variable_cool_ms: 5000
gcode:
    {% set global = printer['gcode_macro _global_var'] %}
    {% set retract_amount = global.retract_amount|float %}
    {% set fan_speed = printer.fan.speed %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Printer not homed")}
    {% endif %}

    {% if printer.extruder.target < 180 or not printer.extruder.can_extrude %}
        {action_raise_error("Extruder not hot enough to kick")}
    {% endif %}

    G90
    M83

    MOVE_TO_TRAY
    G1 E-{retract_amount} F300
    M106 S255
    G4 P{printer["gcode_macro KICK"].cool_ms|int}

    G1 X202 Y264.5 F6000
    G1 F8000
    G1 X181
    G1 X193
    G1 X165
    G1 X190
    G1 X165

    M106 S{(fan_speed * 255)|round|int}

    G1 Y250 F6000

    M400
