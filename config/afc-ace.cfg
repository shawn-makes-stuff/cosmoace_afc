# ─────────────────────────────────────────────────────────────────────────────
# AFC + Anycubic ACE Pro on COSMOS — shared hardware config
#
# Not included directly: one of the cc1-/cc2- entry files includes this, then
# the sensor path and machine pieces. Change values from printer.cfg, below
# the afc-ace include, e.g.
#
#   [AFC_hub ACE_1]
#   afc_bowden_length: 805
#
# EXPERIMENTAL. See README.md.
# ─────────────────────────────────────────────────────────────────────────────

# ── The ACE unit ─────────────────────────────────────────────────────────────
# serial: auto finds the ACE by its USB product string; unit_index 0 is the
# unit plugged into the printer. Pin a port from printer.cfg if needed, with a
# /dev/serial/by-path/ name (ttyACM numbering moves between boots).
# An ACE 2 Pro: protocol: ace2 from printer.cfg (untested on hardware).
[AFC_ACE ACE_1]
protocol: ace1
serial: auto
unit_index: 0
hub: ACE_1
extruder: extruder
feed_speed: 50
retract_speed: 75
purge_park_cmd: _AFC_ACE_PURGE_SPOT   # COSMOS's PURGE position, off the v-slot

# ── Lanes ────────────────────────────────────────────────────────────────────
# dist_hub is set by the sensor-path file.
[AFC_lane lane1]
unit: ACE_1:1
map: T0
load_to_hub: False

[AFC_lane lane2]
unit: ACE_1:2
map: T1
load_to_hub: False

[AFC_lane lane3]
unit: ACE_1:3
map: T2
load_to_hub: False

[AFC_lane lane4]
unit: ACE_1:4
map: T3
load_to_hub: False

# ── Hub ──────────────────────────────────────────────────────────────────────
# The ACE has no hub switch: the hub is virtual, its state derived from the
# lanes. Lengths are set by the sensor-path file.
[AFC_hub ACE_1]
switch_pin: virtual
enable_hub_runout: False

# ── Toolhead ─────────────────────────────────────────────────────────────────
[AFC_extruder extruder]
tool_stn_unload: 32              # pull out of the gears after the cut
tool_sensor_after_extruder: 0
tool_unload_speed: 15
tool_load_speed: 8

# Room for the longest extrude-only move a load makes.
[extruder]
max_extrude_only_distance: 1000

# ── Second (chained) ACE ─────────────────────────────────────────────────────
# Slots 5-8 on a unit chained into the first one's USB passthrough. Copy into
# printer.cfg (below the afc-ace include) and uncomment. Give the lanes the
# same dist_hub as lanes 1-4, plus the extra tube length.
#
# optional: True    -> an unplugged unit is reported at PREP, not a failure
# monitor_only: True -> status, RFID and dryer stay live, motion is refused
#
#[AFC_ACE ACE_2]
#serial: auto
#unit_index: 1
#optional: True
#hub: ACE_1
#extruder: extruder
## Toolhead sensor path only: the same head values afc-ace-toolhead.cfg sets
## on ACE_1 (without them this unit parks 100 mm back and pushes all of
## tool_stn in step with the extruder). dist_hub below is then each tube's
## length from this unit's slot to the merger.
#hub_clear_mm: 65
#sensor_approach_mm: 30
#sensor_approach_speed: 15
#sync_load_mm: 8
#
#[AFC_lane lane5]
#unit: ACE_2:1
#map: T4
#load_to_hub: False
#dist_hub: 1400
#
#[AFC_lane lane6]
#unit: ACE_2:2
#map: T5
#load_to_hub: False
#dist_hub: 1400
#
#[AFC_lane lane7]
#unit: ACE_2:3
#map: T6
#load_to_hub: False
#dist_hub: 1400
#
#[AFC_lane lane8]
#unit: ACE_2:4
#map: T7
#load_to_hub: False
#dist_hub: 1400

# ── AFC itself ───────────────────────────────────────────────────────────────
# On top of COSMOS's extras-readonly/afc.cfg [AFC]; only what the ACE needs
# differently, plus the LED colours AFC's panels show.
[AFC]
load_to_hub: False
homing_enabled: False           # no lane steppers to home: the ACE feeds itself
enable_assist: False
enable_hub_runout: False
park_pre_load: False            # the driver parks before its feed to the sensor
kick_cmd: KICK
spool_ratio: 2
led_fault: 1,0,0,0
led_ready: 0,0,0,0.5
led_not_ready: 1,0,0,0
led_loading: 0.2,0,0,0.5
led_tool_loaded: 1,0,0,1
led_buffer_advancing: 0,0,1,0
led_buffer_trailing: 0,1,0,0
led_buffer_disable: 0,0,0,0.25
led_spool_illuminate: 1,1,1,0
